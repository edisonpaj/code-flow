<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Expert Code Flow</title>
  <style>
    :root { color-scheme: dark; --bg:#03110e; --panel:#081b16; --line:#1b493d; --cyan:#55ead5; --lime:#a9f532; --text:#edf7f3; --muted:#91aaa2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font:14px/1.5 Inter,Segoe UI,Arial,sans-serif; background:radial-gradient(circle at 75% 15%,#12362c 0,transparent 32%),linear-gradient(135deg,#020b09,#061713); }
    .login { width:min(430px,100%); padding:36px; border:1px solid var(--line); border-radius:18px; background:rgba(6,24,19,.94); box-shadow:0 28px 80px rgba(0,0,0,.45); }
    .brand { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
    .mark { display:grid; place-items:center; width:48px; height:48px; border:1px solid var(--lime); border-radius:12px; color:var(--lime); font-weight:900; letter-spacing:-1px; }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:5px 0 8px; font-size:30px; line-height:1.1; }
    h1 em { color:var(--lime); font-style:normal; }
    p { margin:0 0 28px; color:var(--muted); }
    label { display:block; margin:0 0 16px; color:var(--cyan); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    input { width:100%; margin-top:8px; padding:14px 15px; border:1px solid var(--line); border-radius:9px; background:#03100d; color:var(--text); font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
    input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(85,234,213,.1); }
    button { width:100%; min-height:48px; margin-top:8px; border:0; border-radius:9px; background:var(--lime); color:#071109; font-weight:900; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:.6; cursor:wait; }
    #message { min-height:22px; margin:14px 0 0; color:#ff7a75; font-size:13px; }
    footer { margin-top:28px; padding-top:20px; border-top:1px solid rgba(85,234,213,.12); color:#66867c; font-size:12px; text-align:center; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="mark">ECF</span><div><span class="eyebrow">Acesso restrito</span><h1>EXPERT <em>CODE FLOW</em></h1></div></div>
    <p>Entre para acessar análises, inventários e relatórios do microserviço.</p>
    <form id="login-form">
      <label>Usuário<input id="username" name="username" autocomplete="username" required autofocus></label>
      <label>Senha<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Deixe em branco"></label>
      <button id="submit" type="submit">Entrar no sistema</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <footer>Expert-Code-Flow · Ambiente protegido</footer>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const button = document.querySelector('#submit');
    const message = document.querySelector('#message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); message.textContent = ''; button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: form.username.value, password: form.password.value})
        });
        if (!response.ok) throw new Error('Usuário ou senha inválidos.');
        window.location.replace('/');
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
